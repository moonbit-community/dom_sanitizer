name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: tool versions
        run: |
          moon version --all
          node --version

      - name: moon check
        run: |
          moon update
          moon check --target ${{ matrix.target }} --deny-warn

      - name: moon info
        if: matrix.target == 'wasm-gc'
        run: |
          moon info
          git diff --exit-code

      - name: format diff
        if: matrix.target == 'wasm-gc'
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: moon test --target ${{ matrix.target }}

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: install development reference tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          moon update
          moon check --target js --deny-warn

      - name: differential and browser reparse checks
        run: npm run test:browser
